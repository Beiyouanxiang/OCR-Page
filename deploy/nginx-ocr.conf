# OCR-Page 的 Nginx 配置
#
# 推荐做法（方案 A）：挂到现有 80 端口站点的 /ocr/ 路径下，
# 无需新开防火墙端口。把下面两段放进 /etc/nginx/sites-available/bookmark 的 server {} 里。
#
# 前提：应用已改成相对路径（style.css / app.js / api/ocr），
# 因此挂在根路径或子路径下都能正常工作。

# A-1: /ocr 不带斜杠时重定向到 /ocr/，保证相对路径解析基准正确
location = /ocr {
    return 301 /ocr/;
}

# A-2: 主反代。proxy_pass 末尾的 / 会剥掉 /ocr/ 前缀
location /ocr/ {
    proxy_pass http://127.0.0.1:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 图片经 base64 后体积膨胀约 33%，留足余量
    client_max_body_size 15m;

    # 识别可能耗时十几秒
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

